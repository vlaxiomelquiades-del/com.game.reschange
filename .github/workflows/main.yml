      - name: Fix local.properties for the CI runner
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "Adiciona backend Shizuku como alternativa ao root (v${{ steps.version.outputs.name }})"
          git push

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-shizuku
          path: app/build/outputs/apk/debug/*.apk
