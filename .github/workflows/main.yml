name: Add Shizuku backend support

# Workflow de migração única: escreve os arquivos novos/alterados do
# suporte a Shizuku, builda um APK debug pra validar e commita tudo de
# volta no repositório. Rode uma vez (Actions -> Add Shizuku backend
# support -> Run workflow) e depois pode apagar este arquivo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-shizuku:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute next app version
        id: version
        run: |
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          NEW_CODE=$((CURRENT_CODE + 1))
          BASE=$(echo "$CURRENT_NAME" | grep -oP '^[0-9]+\.[0-9]+')
          SUFFIX="${CURRENT_NAME#$BASE}"
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_NAME="${MAJOR}.${NEW_MINOR}${SUFFIX}"
          echo "Versão: $CURRENT_CODE ($CURRENT_NAME) -> $NEW_CODE ($NEW_NAME)"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write new files (Shizuku backend)
        run: |
          mkdir -p app/src/main/aidl/com/game/reschange
          mkdir -p app/src/main/java/com/game/reschange
          mkdir -p app/src/main/res/layout

          cat > app/src/main/aidl/com/game/reschange/IShellService.aidl << 'EOF'
          // AIDL usado pelo UserService do Shizuku. Roda em processo separado,
          // com UID de shell (2000) ou root (0) dependendo de como o Shizuku foi
          // iniciado -- nunca com a identidade normal do app.
          package com.game.reschange;

          interface IShellService {
              String exec(String command) = 1;

              // Codigo de transacao fixo que o Shizuku usa para encerrar o
              // servico ao trocar de versao (ver ShellUserService.destroy()).
              void destroy() = 16777114;
          }
          EOF

          cat > app/src/main/java/com/game/reschange/BackendPrefs.kt << 'EOF'
          package com.game.reschange

          import android.content.Context

          /**
           * Guarda qual backend de execucao privilegiada o usuario escolheu:
           * root (su) ou Shizuku (UserService, sem necessidade de root).
           * Separado do ModePrefs (Default/Alternative), que decide COMO a
           * resolucao e aplicada -- este aqui decide COM QUE PERMISSAO.
           */
          object BackendPrefs {
              private const val PREF_NAME = "backend_prefs"
              private const val KEY_BACKEND = "privileged_backend"
              private const val KEY_CHOOSER_DONE = "chooser_done"

              const val BACKEND_ROOT    = "root"
              const val BACKEND_SHIZUKU = "shizuku"

              fun getBackend(context: Context): String {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_BACKEND, BACKEND_ROOT) ?: BACKEND_ROOT
              }

              fun saveBackend(context: Context, backend: String) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putString(KEY_BACKEND, backend).apply()
              }

              fun isShizuku(context: Context): Boolean = getBackend(context) == BACKEND_SHIZUKU

              /** true assim que o usuario ja passou pela tela inicial de escolha. */
              fun isChooserDone(context: Context): Boolean {
                  return context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .getBoolean(KEY_CHOOSER_DONE, false)
              }

              fun setChooserDone(context: Context) {
                  context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                      .edit().putBoolean(KEY_CHOOSER_DONE, true).apply()
              }

              /** Texto curto pro subtitulo do toolbar ("Root ativo" / "Shizuku ativo"). */
              fun label(context: Context): String {
                  return if (isShizuku(context)) "Shizuku ativo" else "Root ativo"
              }
          }
          EOF

          cat > app/src/main/java/com/game/reschange/ShellUserService.kt << 'EOF'
          package com.game.reschange

          /**
           * Roda no processo separado que o Shizuku cria (nao e um processo de
           * app normal -- Context aqui nao se comporta como numa Activity/Service
           * comuns). Todo comando chega aqui ja com privilegio de shell ou root,
           * entao nao precisa de "su" -- e so ProcessBuilder direto.
           */
          class ShellUserService : IShellService.Stub() {

              override fun exec(command: String): String {
                  return try {
                      val process = ProcessBuilder("sh", "-c", command)
                          .redirectErrorStream(true)
                          .start()
                      val output = process.inputStream.bufferedReader().readText()
                      process.waitFor()
                      output
                  } catch (e: Exception) {
                      "EXEC_FAILED: ${e.message}"
                  }
              }

              override fun destroy() {
                  System.exit(0)
              }
          }
          EOF

          cat > app/src/main/java/com/game/reschange/ShizukuExecutor.kt << 'EOF'
          package com.game.reschange

          import android.content.ComponentName
          import android.content.Context
          import android.content.ServiceConnection
          import android.content.pm.PackageManager
          import android.os.IBinder
          import rikka.shizuku.Shizuku
          import java.util.concurrent.TimeUnit

          /**
           * Ponte para o Shizuku. Mantem uma UserService vinculada (processo
           * separado, mesma ideia de exec que o app ja usa via su, so que sem
           * precisar de root) e expoe chamadas bloqueantes equivalentes ao antigo
           * runAsRoot()/runAsRootWithOutput(), pra encaixar sem reescrever
           * WatcherManager/GameCategoryHint/MainActivity por completo.
           */
          object ShizukuExecutor {

              // Versao do CONTRATO do servico (metodos da AIDL), nao a versionCode
              // do app -- so precisa mudar se a interface IShellService mudar.
              private const val SERVICE_VERSION = 1
              private const val BIND_TIMEOUT_SECONDS = 10L

              @Volatile private var service: IShellService? = null
              private val bindLock = Object()

              private val connection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      service = if (binder?.isBinderAlive == true) IShellService.Stub.asInterface(binder) else null
                      synchronized(bindLock) { bindLock.notifyAll() }
                  }

                  override fun onServiceDisconnected(name: ComponentName?) {
                      service = null
                  }
              }

              private fun args(context: Context) = Shizuku.UserServiceArgs(
                  ComponentName(context.packageName, ShellUserService::class.java.name)
              )
                  .processNameSuffix("shell_service")
                  .debuggable(false)
                  .version(SERVICE_VERSION)
                  .daemon(true)

              /** Shizuku instalado e respondendo (nao diz nada sobre permissao). */
              fun isAvailable(): Boolean {
                  return try {
                      Shizuku.pingBinder() && Shizuku.getVersion() >= 11
                  } catch (_: Throwable) {
                      false
                  }
              }

              fun hasPermission(): Boolean {
                  return try {
                      isAvailable() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (_: Throwable) {
                      false
                  }
              }

              /**
               * Dispara o dialogo de permissao do Shizuku. O resultado nao vem por
               * callback aqui -- quem chama deve reconferir hasPermission() no
               * onResume() da Activity depois que o usuario voltar da tela do
               * Shizuku (ver BackendChooserActivity / SettingsActivity).
               */
              fun requestPermission(requestCode: Int) {
                  if (isAvailable() && !hasPermission()) {
                      Shizuku.requestPermission(requestCode)
                  }
              }

              @Synchronized
              private fun ensureBound(context: Context): IShellService? {
                  service?.let { if (it.asBinder().isBinderAlive) return it }
                  if (!hasPermission()) return null
                  synchronized(bindLock) {
                      Shizuku.bindUserService(args(context.applicationContext), connection)
                      if (service == null) {
                          bindLock.wait(TimeUnit.SECONDS.toMillis(BIND_TIMEOUT_SECONDS))
                      }
                  }
                  return service
              }

              fun runCommand(context: Context, command: String) {
                  try {
                      ensureBound(context)?.exec(command)
                  } catch (_: Exception) {
                  }
              }

              fun runCommandWithOutput(context: Context, command: String): String {
                  return try {
                      ensureBound(context)?.exec(command) ?: "SHIZUKU_UNAVAILABLE"
                  } catch (e: Exception) {
                      "EXEC_FAILED: ${e.message}"
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/game/reschange/PrivilegedExecutor.kt << 'EOF'
          package com.game.reschange

          import android.content.Context
          import java.io.DataOutputStream

          /**
           * Ponto unico de execucao privilegiada do app.
           *
           * Antes, cada arquivo (WatcherManager, GameCategoryHint, MainActivity,
           * SettingsActivity) tinha sua propria copia de runAsRoot() via
           * Runtime.exec("su"). Agora todos passam por aqui, que decide entre
           * root (su) e Shizuku (UserService) de acordo com BackendPrefs -- o
           * resto do app nao precisa saber qual dos dois esta rodando por baixo.
           */
          object PrivilegedExecutor {

              /** Roda um comando descartando a saida (equivalente ao antigo runAsRoot). */
              fun run(context: Context, command: String) {
                  when (BackendPrefs.getBackend(context)) {
                      BackendPrefs.BACKEND_SHIZUKU -> ShizukuExecutor.runCommand(context, command)
                      else -> suExec(command, asShellUid = false)
                  }
              }

              /** Roda um comando e devolve stdout+stderr (equivalente ao antigo runAsRootWithOutput). */
              fun runWithOutput(context: Context, command: String): String {
                  return when (BackendPrefs.getBackend(context)) {
                      BackendPrefs.BACKEND_SHIZUKU -> ShizukuExecutor.runCommandWithOutput(context, command)
                      else -> suExec(command, asShellUid = false)
                  }
              }

              /**
               * Especifico do GameCategoryHint: precisa rodar como UID de shell
               * (2000), nao root (0), porque o metodo oculto valida a UID de quem
               * chama. No root isso exige "su 2000" (nem toda gerenciadora aceita).
               * No Shizuku isso e automatico -- uma sessao iniciada via ADB/wireless
               * debugging ja roda nativamente como UID 2000.
               */
              fun runAsShellUid(context: Context, command: String): String {
                  return when (BackendPrefs.getBackend(context)) {
                      BackendPrefs.BACKEND_SHIZUKU -> ShizukuExecutor.runCommandWithOutput(context, command)
                      else -> suExec(command, asShellUid = true)
                  }
              }

              private fun suExec(command: String, asShellUid: Boolean): String {
                  return try {
                      val process = if (asShellUid)
                          Runtime.getRuntime().exec(arrayOf("su", "2000"))
                      else
                          Runtime.getRuntime().exec("su")
                      val os = DataOutputStream(process.outputStream)
                      os.writeBytes("$command\n")
                      os.writeBytes("exit\n")
                      os.flush()
                      os.close()
                      val output = process.inputStream.bufferedReader().readText()
                      val errOutput = process.errorStream.bufferedReader().readText()
                      process.waitFor()
                      output + errOutput
                  } catch (e: Exception) {
                      "EXEC_FAILED: ${e.message}"
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/game/reschange/BackendChooserActivity.kt << 'EOF'
          package com.game.reschange

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.cardview.widget.CardView
          import androidx.core.view.WindowCompat

          /**
           * Tela mostrada apenas na primeira execucao do app, antes da MainActivity,
           * para escolher o backend de execucao privilegiada (root ou Shizuku).
           * Pode ser trocado depois em Settings -- ver BackendPrefs/SettingsActivity.
           */
          class BackendChooserActivity : AppCompatActivity() {

              private var awaitingShizukuPermission = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  setContentView(R.layout.activity_backend_chooser)

                  findViewById<CardView>(R.id.cardRoot).setOnClickListener {
                      BackendPrefs.saveBackend(this, BackendPrefs.BACKEND_ROOT)
                      finishChooser()
                  }

                  findViewById<CardView>(R.id.cardShizuku).setOnClickListener {
                      when {
                          ShizukuExecutor.hasPermission() -> {
                              BackendPrefs.saveBackend(this, BackendPrefs.BACKEND_SHIZUKU)
                              finishChooser()
                          }
                          ShizukuExecutor.isAvailable() -> {
                              awaitingShizukuPermission = true
                              ShizukuExecutor.requestPermission(SHIZUKU_PERMISSION_REQUEST_CODE)
                              Toast.makeText(this,
                                  "Conceda a permissão do Shizuku na tela que abriu.",
                                  Toast.LENGTH_LONG).show()
                          }
                          else -> {
                              Toast.makeText(this,
                                  "Shizuku não detectado. Instale e inicie o Shizuku, ou escolha Root.",
                                  Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (awaitingShizukuPermission) {
                      awaitingShizukuPermission = false
                      if (ShizukuExecutor.hasPermission()) {
                          BackendPrefs.saveBackend(this, BackendPrefs.BACKEND_SHIZUKU)
                          finishChooser()
                      } else {
                          Toast.makeText(this, "Permissão do Shizuku não concedida.", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun finishChooser() {
                  BackendPrefs.setChooserDone(this)
                  startActivity(Intent(this, MainActivity::class.java))
                  finish()
              }

              companion object {
                  private const val SHIZUKU_PERMISSION_REQUEST_CODE = 7788
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_backend_chooser.xml << 'EOF'
